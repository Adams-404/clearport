name: clearport
description: "A clean, minimal Flutter chat client for local AI servers."
publish_to: 'none'
version: 1.1.1+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.5
  file_selector: ^1.0.3
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/clearport-logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/clearport-logo.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/clearport-logo.png
