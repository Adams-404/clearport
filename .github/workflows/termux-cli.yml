name: Termux CLI checks

on:
  push:
    paths:
      - "scripts/**"
      - "docs/termux-cli.md"
      - ".github/workflows/termux-cli.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "docs/termux-cli.md"
      - ".github/workflows/termux-cli.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate Bash CLI and installer
        run: bash -n scripts/clearport scripts/install-termux.sh
      - name: Validate POSIX server helper
        run: sh -n scripts/clearport-server
